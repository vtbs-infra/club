name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  queue: max

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:check -- --tag "$GITHUB_REF_NAME"

  verify:
    needs: metadata
    uses: ./.github/workflows/ci.yml
    with:
      release-tag: ${{ github.ref_name }}

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: regclient/actions/regctl-installer@dd58ad94f76adb73d8ac1bf75ed25f01545d5b32 # v0.2.0
        with:
          release: v0.11.7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.image-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified artifact and reconcile the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_DIGEST: ${{ needs.verify.outputs.image-digest }}
        run: |
          regctl image import "ocidir://$RUNNER_TEMP/club-layout:ci" "$RUNNER_TEMP/release/club.oci.tar"
          npm exec -- tsx scripts/publish-release.ts \
            --tag "$GITHUB_REF_NAME" --revision "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" \
            --candidate "ocidir://$RUNNER_TEMP/club-layout:ci" --digest "$EXPECTED_DIGEST"
