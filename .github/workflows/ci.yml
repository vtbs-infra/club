name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: club_test
          POSTGRES_PASSWORD: club
          POSTGRES_USER: club
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U club -d club_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
      DATABASE_URL: postgres://club:club@127.0.0.1:5432/club_test
      TEST_DATABASE_URL: postgres://club:club@127.0.0.1:5432/club_test

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm browser:install --with-deps
      - run: pnpm test:browser
      - run: docker build --tag club-ci:${{ github.sha }} .

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate release metadata
        run: >-
          pnpm release:check -- --tag "$GITHUB_REF_NAME"
          --notes-file "$RUNNER_TEMP/release-notes.md"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "Club $GITHUB_REF_NAME"
          --notes-file "$RUNNER_TEMP/release-notes.md"
