name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ''
    outputs:
      image-artifact-id:
        value: ${{ jobs.image.outputs.artifact-id }}
      image-digest:
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: club_test
          POSTGRES_PASSWORD: club
          POSTGRES_USER: club
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U club -d club_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
      DATABASE_URL: postgres://club:club@127.0.0.1:5432/club_test
      TEST_DATABASE_URL: postgres://club:club@127.0.0.1:5432/club_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit
      - run: npm run check
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run browser:install -- --with-deps
      - run: npm exec -- playwright test --project chromium --project e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: regclient/actions/regctl-installer@dd58ad94f76adb73d8ac1bf75ed25f01545d5b32 # v0.2.0
        with:
          release: v0.11.7
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          provenance: mode=max
          sbom: true
          tags: localhost/club-ci:candidate
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=oci,dest=${{ runner.temp }}/club.oci.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load the candidate from the complete OCI artifact
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          regctl image import "ocidir://$RUNNER_TEMP/club-layout:ci" "$RUNNER_TEMP/club.oci.tar"
          test "$(regctl image digest "ocidir://$RUNNER_TEMP/club-layout:ci")" = "$EXPECTED_DIGEST"
          regctl image export --platform linux/amd64 --name localhost/club-ci:candidate \
            "ocidir://$RUNNER_TEMP/club-layout:ci" "$RUNNER_TEMP/club-runtime.tar"
          docker load --input "$RUNNER_TEMP/club-runtime.tar"
          expected_config=$(regctl manifest get "ocidir://$RUNNER_TEMP/club-layout:ci" \
            --platform linux/amd64 --format '{{json .}}' | jq -r '.config.digest')
          test "$(docker image inspect localhost/club-ci:candidate --format '{{.Id}}')" = "$expected_config"
      - run: node tests/container/smoke.mjs --image localhost/club-ci:candidate
      - id: artifact
        if: inputs.release-tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: club-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/club.oci.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
