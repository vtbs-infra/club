name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: club_test
          POSTGRES_PASSWORD: club
          POSTGRES_USER: club
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U club -d club_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
      DATABASE_URL: postgres://club:club@127.0.0.1:5432/club_test
      TEST_DATABASE_URL: postgres://club:club@127.0.0.1:5432/club_test

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm browser:install --with-deps
      - run: pnpm test:browser
