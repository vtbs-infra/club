x-app-environment: &app-environment
  APP_URL: ${APP_URL:?Set APP_URL in .env}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
  ADDRESS_ENCRYPTION_ACTIVE_KEY_VERSION: ${ADDRESS_ENCRYPTION_ACTIVE_KEY_VERSION:?Set ADDRESS_ENCRYPTION_ACTIVE_KEY_VERSION in .env}
  ADDRESS_ENCRYPTION_KEY_RING: ${ADDRESS_ENCRYPTION_KEY_RING:?Set ADDRESS_ENCRYPTION_KEY_RING in .env}
  BILIBILI_LIVE_SOURCE: ${BILIBILI_LIVE_SOURCE:-public-web}
  BILIBILI_ROSTER_SOURCE: ${BILIBILI_ROSTER_SOURCE:-public-web}
  DATABASE_URL: ${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL in .env}
  HOST: 0.0.0.0
  LOG_LEVEL: ${LOG_LEVEL:-info}
  NODE_ENV: production
  PORT: 3000
  STORAGE_DRIVER: local
  STORAGE_LOCAL_PATH: /data/club
  TRACKING_PROVIDER: ${TRACKING_PROVIDER:-none}
  TRUST_PROXY: ${TRUST_PROXY:-false}

services:
  app:
    build: .
    init: true
    restart: unless-stopped
    environment: *app-environment
    ports:
      - '${CLUB_PORT:-3000}:3000'
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    volumes:
      - club-storage:/data/club
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: club
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: club
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U club -d club']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - club-postgres:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true

volumes:
  club-postgres:
  club-storage:
