services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: development-only-change-this-secret
      BILIBILI_LIVE_SOURCE: public-web
      BILIBILI_ROSTER_SOURCE: public-web
      DATABASE_URL: postgres://club:club-dev@postgres:5432/club
      HOST: 0.0.0.0
      LOG_LEVEL: info
      NODE_ENV: production
      PORT: 3000
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /data/club
      TRUST_PROXY: 'false'
    ports:
      - '3000:3000'
    volumes:
      - club-storage:/data/club
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: club
      POSTGRES_PASSWORD: club-dev
      POSTGRES_USER: club
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U club -d club']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - club-postgres:/var/lib/postgresql/data

volumes:
  club-postgres:
  club-storage:
